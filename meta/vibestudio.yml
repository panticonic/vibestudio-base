defaultAutomations:
  workspace-updates:
    events: [ app-update ]
    action:
      code: |
        import { extensions } from "@workspace/runtime";
        return await extensions.invoke("@workspace-extensions/templates", "updateSignal", []);
      kind: watch
      syntax: typescript
    className: AiChatWorker
    name: Workspace update assistant
    operations: []
    source: workers/agent-worker
    summary: Check upstream sources and notify me about new updates. Ask before merging or installing anything.
    trigger:
      everyMs: 21600000
      kind: schedule
defaultRepo: projects/default
extensions:
  - source: extensions/git-bridge
  - source: extensions/speech
  - source: extensions/image-service
  - source: extensions/pdf-ingest
  - source: extensions/file-tools
  - source: extensions/shell
  - source: extensions/templates
  - source: extensions/test-runner
initPanels:
  - source: about/new
providers:
  cdpClient:
    source: "@workspace/cdp-client"
  evalEngine:
    source: "@workspace/eval"
  evalRuntime:
    source: "@workspace/runtime"
  gitInterop:
    extension: extensions/git-bridge
services:
  - source: workers/workspace-source
    name: gad.workspace
  - source: workers/pubsub-channel
    name: channel
  - source: workers/workspace-presentation
    name: workspace.presentation
  - source: workers/model-settings
    name: models
  - source: workers/quickfire-service
    name: quickfire
  - source: workers/missions
    name: missions
  - source: workers/testkit-driver
    name: testkit-driver
singletonObjects:
  - className: TestkitDriverDO
    key: workspace-testkit-driver
    source: workers/testkit-driver
  - className: GadWorkspaceDO
    key: workspace
    source: workers/workspace-source
  - className: WorkspacePresentationDO
    key: workspace-presentation
    source: workers/workspace-presentation
  - className: ModelSettingsDO
    key: workspace-model-settings
    source: workers/model-settings
  - className: QuickfireSessionsDO
    key: workspace-quickfire
    source: workers/quickfire-service
  - className: MissionsDO
    key: workspace-missions
    source: workers/missions
minimumAppVersion: 0.1.84
systemEpoch: 0
template:
  description: Shared native agent, workspace and tooling foundations.
  name: Base
